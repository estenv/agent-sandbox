[package]
name = "agent-sandbox-helper-daemon"
version = "0.1.0"
edition = "2021"
description = "Host-side helper daemon skeleton for agent-sandbox"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agent-sandbox-helper-daemon"
path = "src/main.rs"

[[bin]]
name = "agent-sandbox-helper"
path = "src/bin/helper.rs"
